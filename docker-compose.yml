# docker compose up --build   ->   http://localhost:8000
#
# One service on purpose. The database is a SQLite file and the model is a cache directory;
# neither earns a container of its own at this scale, and splitting them would add moving
# parts to a setup whose whole claim is that a stranger can clone and run it in minutes.

services:
  coconut:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Anchored inside the named volume so the queue, decisions and audit trail survive
      # `docker compose down`. Left at the default it would live in the container's
      # writable layer and vanish with it.
      DATABASE_URL: sqlite:////data/coconut.db
    volumes:
      # The NLI model is ~750MB and is downloaded on first start. Named, so it is fetched
      # once for the life of the volume rather than on every rebuild.
      - model-cache:/models
      - coconut-data:/data
    restart: unless-stopped

volumes:
  model-cache:
  coconut-data:
