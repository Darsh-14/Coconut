<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1280" role="img" aria-labelledby="title desc">
  <title id="title">Coconut decision architecture</title>
  <desc id="desc">Disputes first pass through payment-rail rules, then an evidence and risk engine when required, and finally a human-controlled action with an audit record.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 10 5 0 10z" fill="#6b7280"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#111827" flood-opacity="0.08"/>
    </filter>
    <style>
      .group{fill:#f8fafc;stroke:#d9dee7;stroke-width:2}.card{fill:#fff;stroke:#cbd2dc;stroke-width:2;filter:url(#shadow)}
      .model{fill:#eef6ff;stroke:#397ac2}.rule{fill:#fff7e6;stroke:#bf7610}.contest{fill:#edf9f1;stroke:#25824e}
      .review{fill:#f4f0ff;stroke:#7357bc}.accept{fill:#fff2f1;stroke:#bd4945}.noaction{fill:#f3f4f6;stroke:#6b7280}
      .human{fill:#111827;stroke:#111827}.audit{fill:#fff;stroke:#111827}.line{fill:none;stroke:#6b7280;stroke-width:3;marker-end:url(#arrow)}
      .join{fill:none;stroke:#6b7280;stroke-width:3}
      .group-title{font:700 18px Inter,Arial,sans-serif;letter-spacing:1.8px;fill:#475569}.step{font:750 15px Inter,Arial,sans-serif;fill:#fff}
      .title{font:700 26px Inter,Arial,sans-serif;fill:#111827}.body{font:400 20px Inter,Arial,sans-serif;fill:#4b5563}
      .small{font:500 17px Inter,Arial,sans-serif;fill:#6b7280}.label{font:650 16px Inter,Arial,sans-serif;fill:#475569}
      .white-title{font:700 25px Inter,Arial,sans-serif;fill:#fff}.white-body{font:400 18px Inter,Arial,sans-serif;fill:#d1d5db}
    </style>
  </defs>

  <rect width="1600" height="1280" fill="#fff"/>
  <rect class="group" x="35" y="30" width="485" height="1215" rx="28"/>
  <rect class="group" x="555" y="30" width="560" height="1215" rx="28"/>
  <rect class="group" x="1150" y="30" width="415" height="1215" rx="28"/>

  <rect x="70" y="62" width="36" height="28" rx="8" fill="#111827"/><text class="step" x="88" y="82" text-anchor="middle">1</text>
  <text class="group-title" x="120" y="83">INPUT &amp; RAIL INTELLIGENCE</text>
  <rect x="590" y="62" width="36" height="28" rx="8" fill="#397ac2"/><text class="step" x="608" y="82" text-anchor="middle">2</text>
  <text class="group-title" x="640" y="83">EVIDENCE &amp; RISK ENGINE</text>
  <rect x="1180" y="62" width="36" height="28" rx="8" fill="#111827"/><text class="step" x="1198" y="82" text-anchor="middle">3</text>
  <text class="group-title" x="1230" y="83">HUMAN CONTROL</text>

  <!-- Flow lines -->
  <path class="line" d="M280 280V340"/>
  <path class="line" d="M280 470V550"/>
  <path class="line" d="M490 395H540V205H590"/>
  <path class="line" d="M490 645H540V500H590"/>
  <path class="line" d="M490 720H1130V805H1180"/>
  <path class="line" d="M835 580V670"/>
  <path class="line" d="M1080 735H1128V225H1180"/>
  <path class="line" d="M1080 805H1138V435H1180"/>
  <path class="line" d="M1080 875H1140V620H1180"/>
  <path class="line" d="M1530 225H1545V995H1530"/>
  <path class="join" d="M1530 435H1545"/><path class="join" d="M1530 620H1545"/><path class="join" d="M1530 805H1545"/>
  <path class="line" d="M1355 1060V1120"/>

  <!-- Flow labels -->
  <rect x="495" y="176" width="90" height="34" rx="8" fill="#fff"/><text class="label" x="540" y="199" text-anchor="middle">Card/RuPay</text>
  <rect x="288" y="492" width="46" height="31" rx="7" fill="#fff"/><text class="label" x="311" y="514" text-anchor="middle">UPI</text>
  <rect x="495" y="474" width="90" height="34" rx="8" fill="#fff"/><text class="label" x="540" y="497" text-anchor="middle">within cap</text>
  <rect x="754" y="608" width="162" height="34" rx="8" fill="#fff"/><text class="label" x="835" y="631" text-anchor="middle">per-item verdicts</text>

  <!-- Input and rail intelligence -->
  <rect class="card" x="70" y="130" width="420" height="150" rx="20"/>
  <text class="title" x="100" y="175">Dispute input</text>
  <text class="body" x="100" y="213">Bank claim · reason code · amount</text>
  <text class="body" x="100" y="244">Payment rail · evidence · payer history</text>

  <rect class="card" x="70" y="340" width="420" height="130" rx="20"/>
  <text class="title" x="100" y="389">Rail router</text>
  <text class="body" x="100" y="428">Apply known rules before statistical inference</text>

  <rect class="card rule" x="70" y="550" width="420" height="220" rx="20"/>
  <text class="title" x="100" y="597">NPCI UPI rules</text>
  <text class="body" x="100" y="638">Count the rolling 30-day dispute budget</text>
  <text class="body" x="100" y="674">CD1 · payer cap 10</text>
  <text class="body" x="100" y="707">CD2 · payer-payee cap 5</text>
  <text class="small" x="100" y="744">Versioned source and verification date</text>

  <!-- Evidence and risk engine -->
  <rect class="card model" x="590" y="130" width="490" height="450" rx="22"/>
  <text class="title" x="620" y="178">Local evidence verifier</text>
  <text class="small" x="620" y="210">Pinned DeBERTa-v3 NLI · one pass per record</text>
  <rect x="620" y="250" width="205" height="145" rx="16" fill="#fff" stroke="#9cc2e9" stroke-width="2"/>
  <text class="label" x="642" y="285">ENGAGEMENT</text><text class="body" x="642" y="326">Does this record</text><text class="body" x="642" y="356">address the claim?</text>
  <rect x="845" y="250" width="205" height="145" rx="16" fill="#fff" stroke="#9cc2e9" stroke-width="2"/>
  <text class="label" x="867" y="285">SUBSTANTIATION</text><text class="body" x="867" y="326">Does it contain</text><text class="body" x="867" y="356">specific proof?</text>
  <path class="line" d="M722 395V440H835V450"/><path class="line" d="M948 395V440H835V450"/>
  <rect x="620" y="450" width="430" height="100" rx="16" fill="#dceeff" stroke="#72a9dd" stroke-width="2"/>
  <text class="label" x="645" y="486">EVIDENCE VERDICT</text><text class="body" x="645" y="522">Support · contradict · neutral · highlighted span</text>

  <rect class="card model" x="590" y="670" width="490" height="270" rx="22"/>
  <text class="title" x="620" y="717">Explicit risk policy</text>
  <text class="body" x="620" y="758">Strong contradiction</text><text class="label" x="1038" y="758" text-anchor="end">ACCEPT</text>
  <text class="body" x="620" y="806">Support clears every safeguard</text><text class="label" x="1038" y="806" text-anchor="end">CONTEST</text>
  <text class="body" x="620" y="854">Mixed, weak or incomplete</text><text class="label" x="1038" y="854" text-anchor="end">REVIEW</text>
  <line x1="620" y1="878" x2="1050" y2="878" stroke="#aec9e4" stroke-width="2"/>
  <text class="small" x="620" y="911">Synthetic demo/eval: safety gate may only demote</text>

  <rect x="590" y="1010" width="490" height="155" rx="20" fill="#fff" stroke="#cbd2dc" stroke-width="2"/>
  <text class="label" x="620" y="1050">HARD DECISION BOUNDARY</text>
  <text class="body" x="620" y="1087">The LLM cannot change a verdict or confidence.</text>
  <text class="body" x="620" y="1121">Nothing is transmitted to Razorpay automatically.</text>
  <text class="small" x="620" y="1150">Every final action belongs to the merchant.</text>

  <!-- Outcomes and human control -->
  <rect class="card contest" x="1180" y="130" width="350" height="190" rx="20"/>
  <text class="title" x="1210" y="176">Contest</text><text class="body" x="1210" y="213">Build editable representment</text><text class="body" x="1210" y="245">from the cited evidence</text>
  <rect x="1210" y="269" width="285" height="30" rx="8" fill="#d8f0e0"/><text class="small" x="1225" y="290">Optional LLM: wording only</text>

  <rect class="card review" x="1180" y="365" width="350" height="140" rx="20"/>
  <text class="title" x="1210" y="414">Human review</text><text class="body" x="1210" y="452">State which condition failed</text><text class="small" x="1210" y="480">No forced model answer</text>

  <rect class="card accept" x="1180" y="550" width="350" height="140" rx="20"/>
  <text class="title" x="1210" y="599">Accept</text><text class="body" x="1210" y="637">Evidence supports the bank's claim</text><text class="small" x="1210" y="665">Avoid weak representment cost</text>

  <rect class="card noaction" x="1180" y="735" width="350" height="140" rx="20"/>
  <text class="title" x="1210" y="784">No action</text><text class="body" x="1210" y="822">Expected URCS reject · CD1 / CD2</text><text class="small" x="1210" y="850">Rule outcome · no model confidence</text>

  <rect class="human" x="1180" y="930" width="350" height="130" rx="20"/>
  <text class="white-title" x="1210" y="974">Human action</text><text class="white-body" x="1210" y="1008">Approve · reject · acknowledge</text><text class="white-body" x="1210" y="1034">or withdraw</text>

  <rect class="card audit" x="1180" y="1120" width="350" height="100" rx="20"/>
  <text class="title" x="1210" y="1160">Audit record</text><text class="small" x="1210" y="1193">Decision · model · threshold · payload</text>
</svg>
